<!DOCTYPE html>
<html>
<head>
  <title>Pinnacle Travel Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('hotel_vacation_background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    #chatbox {
      width: 60%;
      margin: auto;
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 10px;
    }
    #conversation {
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    input {
      width: 80%;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: #ff9800;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Bot name displayed above -->
  <h1>🌴 Pinnacle Travel Bot 🌴</h1>

  <div id="chatbox">
    <div id="conversation"></div>
    <input type="text" id="userInput" placeholder="Type your message..." autofocus>
    <button id="sendBtn">Send</button>
  </div>

  <script>
    async function sendMessage() {
      let inputBox = document.getElementById("userInput");
      let message = inputBox.value.trim();
      if(message === "") return;

      document.getElementById("conversation").innerHTML += "<p><b>You:</b> " + message + "</p>";

      try {
        let response = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: message, user_id: "guest"})
        });

        let data = await response.json();
        document.getElementById("conversation").innerHTML += "<p><b>Pinnacle Travel Bot:</b> " + data.reply + "</p>";

        let convo = document.getElementById("conversation");
        convo.scrollTop = convo.scrollHeight;
      } catch (err) {
        document.getElementById("conversation").innerHTML += "<p style='color:red'><b>Error:</b> Could not reach server.</p>";
      }

      inputBox.value = "";
      inputBox.focus();
    }

    document.getElementById("userInput").addEventListener("keypress", function(event) {
      if(event.key === "Enter") sendMessage();
    });
    document.getElementById("sendBtn").addEventListener("click", sendMessage);
  </script>
</body>
</html>
